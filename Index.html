<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Circuits Visualised</title>
	<link rel="stylesheet" href="styles/app.css" />
</head>
<body>
	<div id="app">
		<div class="topbar" id="topbar">
			<div class="topbar-row">
				<div class="title">Circuits Visualised</div>
				<div class="controls"><div class="legend" id="legend"></div></div>
				<div class="topbar-right">A Wood</div>
			</div>
		</div>
		<div class="high-current-warning" id="highCurrentWarning">
			&#9888; A very high current has been detected indicating a short circuit may have occurred. For a more realistic simulation of this, please enable Internal Resistance.
		</div>
		<div class="canvas-wrap" id="canvasWrap">
			<canvas id="scene"></canvas>
		</div>
		<button class="side-menu-toggle" id="sideMenuToggle" type="button" title="Display Controls">View</button>
		<div class="side-menu hidden" id="sideMenu">
			<div class="side-menu-header">
				<h3>Display controls</h3>
				<button class="side-menu-close" id="sideMenuClose" type="button" title="Close" aria-label="Close display menu">&#8250;</button>
			</div>
			<div class="side-menu-controls">
				<label class="chip"><input id="voltageColor" type="checkbox" /> <span>Voltage colour code</span></label>
				<label class="chip" id="potentialGraphChip"><input id="potentialGraph" type="checkbox" /> <span>Potential graph</span></label>
				<label class="chip"><input id="invertVoltageAxis" type="checkbox" checked /> <span>Invert voltage axis</span></label>

				<label class="chip"><input id="debugLabels" type="checkbox" /> <span>Debug labels</span></label>
				<label class="chip"><input id="debugJunctionIds" type="checkbox" /> <span>Junction IDs</span></label>
				<label class="chip"><input id="debugNodePotentials" type="checkbox" /> <span>Node potentials</span></label>
				<label class="chip"><input id="wireResLabels" type="checkbox" /> <span>Wire R &amp; V labels</span></label>
			</div>
		</div>
		<button class="component-menu-toggle" id="componentMenuToggle" type="button">Component controls</button>
		<div class="component-menu hidden" id="componentMenu">
			<div class="component-menu-header">
				<div class="component-menu-title">Component Controls</div>
				<button class="component-menu-close" id="componentMenuClose" type="button" title="Close" aria-label="Close component menu">&#8250;</button>
			</div>
			<div class="component-menu-body">
				<div class="component-row">
					<label class="chip"><input id="intR" type="checkbox" /> <span>Internal r</span></label>
					<label class="chip"><input id="cell1" type="checkbox" checked /> <span>Cell1</span></label>
					<label class="chip"><input id="cell2" type="checkbox" /> <span>Cell2</span></label>
					<label class="chip"><input id="cell3" type="checkbox" /> <span>Cell3</span></label>
					<label class="chip"><input id="cell4" type="checkbox" /> <span>Cell4</span></label>
				</div>
				<div class="component-row">
					<label class="chip"><input id="R1" type="checkbox" checked /> <span>R1</span><input id="R1box" type="number" min="0.1" max="10" step="0.1" value="2.5" /><span>&#x03A9;</span></label>
					<label class="chip"><input id="R2" type="checkbox" /> <span>R2</span><input id="R2box" type="number" min="0.1" max="10" step="0.1" value="5.0" /><span>&#x03A9;</span></label>
					<label class="chip"><input id="R3" type="checkbox" /> <span>R3</span><input id="R3box" type="number" min="0.1" max="10" step="0.1" value="7.5" /><span>&#x03A9;</span></label>
					<label class="chip"><input id="R4" type="checkbox" /> <span>R4</span><input id="R4box" type="number" min="0.1" max="10" step="0.1" value="10.0" /><span>&#x03A9;</span></label>
				</div>
				<div class="component-row">
					<label class="chip"><input id="s1" type="checkbox" /> <span>S1</span></label>
					<label class="chip"><input id="s2" type="checkbox" /> <span>S2</span></label>
					<label class="chip"><input id="s3" type="checkbox" /> <span>S3</span></label>
					<label class="chip"><input id="s4" type="checkbox" /> <span>S4</span></label>
				</div>
			</div>
		</div>
	</div>

	<script type="module" src="scripts/app.js"></script>
</body>
</html>
